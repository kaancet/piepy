name: CI

on:
  push:
    branches: [main, big-refactor]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install from uv.lock, so CI uses the EXACT versions committed to the repo.
      # `uv sync` (not `uv pip install`) is the only command that reads uv.lock.
      # `--locked` fails loudly if uv.lock is stale vs pyproject.toml, instead of
      # silently resolving something different from what you run locally.
      # Run this same line locally to reproduce CI exactly.
      - name: Install (locked, test group)
        run: uv sync --locked --no-dev --group test

      # Lint scope is intentionally limited to new code (tests/) for now; the
      # full-repo lint cleanup is a separate task in docs/refactor_plan.md.
      # No flags here on purpose: line-length etc. live in pyproject.toml only.
      - name: Lint tests
        run: |
          .venv/bin/ruff check tests
          .venv/bin/black --check tests

      # Golden parse tests need local session data and are excluded here.
      - name: Run data-free tests
        run: .venv/bin/pytest -m "not needs_data" -v
