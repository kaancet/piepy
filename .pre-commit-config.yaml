# Hooks run only on changed files, so this does NOT reformat the whole repo at
# once - files get tidied as you touch them during the refactor.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-yaml
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: check-added-large-files
        args: ["--maxkb=1024"]
# ruff = linter only (unused imports, undefined names, ...). Formatting stays
# with black below, so the two never fight over layout.
#
# These run the tools from .venv instead of pre-commit downloading its own copies,
# so uv.lock is the SINGLE source of the ruff/black version. A hook can no longer
# pass locally on one version while CI fails on another. No args here either:
# line-length etc. come from pyproject.toml.
#
# Requires the venv: uv sync --locked --group dev
-   repo: local
    hooks:
    -   id: ruff
        name: ruff (from .venv)
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
    -   id: black
        name: black (from .venv)
        entry: .venv/bin/black
        language: system
        types_or: [python, pyi]
# strip outputs + execution counts from notebooks before they get committed
-   repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
    -   id: nbstripout
