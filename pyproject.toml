[project]
name = "piepy-neuro"
version = "0.1.1"
description = "Code for Behavioral, Imaging Analysis"
authors = [{name = "Sakir Kaan Cetindag", email = "cetindag.kaan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["neuroscience","psychophysics", "imaging", "analysis"]

classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
  "Typing :: Typed",
]

dependencies = [
    "behaviz >= 5.10",
    "numpy == 2.2.6",
    "matplotlib >= 3.10.0",
    "patito ~= 0.8.3",
    "polars ~= 1.19.0",
    "pyarrow",
    "tqdm == 4.65.1",
    "bokeh",
    "scipy",
    "pandas <3",
    "colorama",
    "pillow",
    "opencv-python",
    "ipykernel",
    "pystackreg",
    "tabulate",
    "tifffile",
    "natsort",
    "scikit-learn",
    "scikit-image",
    "temporaldata>=0.1.6",
]

[project.optional-dependencies]
test = ["pytest >=8", "ruff >=0.6", "black >=24"]
dev = ["pre-commit", "jupyter", "pytest >=8", "ruff >=0.6", "black >=24"]


[project.scripts]
parsemouse = "piepy.core.mouse:main"
session = "piepy.core.session_launcher:main"
dashboard = "piepy.plotters.bokeh_plot.launcher:main"

[project.urls]
Homepage = "https://github.com/kaancet/piepy"

[build-system]
requires = ["setuptools >= 68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piepy*"]
exclude = ["notebooks*", "res*", "build*", "*.egg-info*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "needs_data: requires real session data resolved via ~/.piepy/config.json (skipped when absent)",
]

[tool.ruff]
target-version = "py312"
line-length = 90  # match black

[tool.ruff.lint]
# Lenient on purpose for now; full-repo lint cleanup is a separate task.
# black owns line length, so E501 is ignored here.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.black]
line-length = 90
target-version = ["py312"]
